name: Android APK

# Every push to main produces an installable APK as a build artifact.
#
# Built on the GitHub runner with `expo prebuild` + Gradle rather than EAS, for
# two reasons: this repo is public, so Actions minutes are free and unlimited,
# whereas EAS Build's free tier is a capped number of builds per month that a
# push-triggered workflow would exhaust and then queue behind. And the APK lands
# in the run's artifacts instead of behind an Expo account.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push supersedes the first: nobody wants the APK for a commit that is
# already two behind, and an Android build holds a runner for ~20 minutes.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The build job widens this to `contents: write` for
# itself, because publishing a Release writes a tag and an asset.
permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read-only, deliberately. This job runs ~739 npm packages, Gradle and
      # its plugins, and `expo prebuild` — a lot of third-party code. A
      # write-scoped GITHUB_TOKEN sitting in that environment is a supply-chain
      # foothold: anything in the dependency tree could push to the repo or
      # rewrite a release. Publishing happens in a separate job below, which
      # runs no repository code at all.
      contents: read
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Keeps the token out of .git/config for the rest of the job.
          persist-credentials: false

      # Pinned to a full commit SHA, not a tag: `@v4` is mutable, and this job
      # has the signing keystore and the Firebase config in its environment.
      # Bump deliberately (v6 is current upstream); Dependabot can do it.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Matches the pnpm that wrote pnpm-lock.yaml (lockfileVersion 9.0).
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Deliberately NO `cache: gradle` here. It derives its cache key from
          # hashFiles('**/*.gradle*'), and android/ does not exist yet — Expo
          # generates it in the prebuild step below, so setup-java fails with
          # "No file ... matched". Gradle caching happens after prebuild instead,
          # with actions/cache, which is first-party either way.

      # Tries --frozen-lockfile FIRST, so drift between package.json and
      # pnpm-lock.yaml is reported rather than silently resolved into a tree
      # nobody has locally. But drift does not block the APK: the point of this
      # workflow is that every push to main yields an installable build, and
      # three of the first four runs died here on a lockfile that had not been
      # committed alongside its manifest. So it warns and continues.
      #
      # Fix the warning by committing the two together:
      #   pnpm install --lockfile-only && git add package.json pnpm-lock.yaml
      #
      # `nodeLinker: hoisted` comes from pnpm-workspace.yaml, which React
      # Native's Metro resolver requires.
      - name: Install dependencies
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if pnpm install --frozen-lockfile; then
            echo "::notice::pnpm-lock.yaml is in step with package.json."
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # A signing keystore is configured, so this build produces a
            # distributable artifact. Resolving fresh here would sign a
            # dependency tree nobody reviewed — that is the one case where
            # losing the APK is cheaper than shipping it. Hard fail.
            echo "::error title=Lockfile drift on a signed build::pnpm-lock.yaml is stale against package.json. A release-signed APK is not built from an unverified tree. Run 'pnpm install --lockfile-only' and commit pnpm-lock.yaml with package.json."
            exit 1
          else
            echo "::warning title=Lockfile drift::pnpm-lock.yaml is stale against package.json, so this APK was built from a freshly resolved tree rather than the committed one. Run 'pnpm install --lockfile-only' and commit pnpm-lock.yaml with package.json."
            pnpm install --no-frozen-lockfile
          fi

      # `google-services.json` is gitignored — correct for a public repo, since
      # it carries the Firebase client config. app.config.ts references it via
      # android.googleServicesFile, so the Expo plugin fails the prebuild when
      # it is absent.
      #
      # With the secret set, the real file is used and the APK can receive push.
      # Without it, a structurally valid placeholder keeps the build green; the
      # APK is identical except that FCM will not register. PRD-v2 §1.5 defers
      # push for v2.0 anyway ("the subscription table ships; the sender does
      # not"), so that is not yet a loss worth failing a build over.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f google-services.json ]; then
            echo "::notice::google-services.json is present in the checkout; using it."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
            echo "::notice::Wrote google-services.json from the GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret — writing a placeholder. The APK will build but push notifications will not work. Add the secret to get a push-capable build."
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ecolife-ci-placeholder",
              "storage_bucket": "ecolife-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "app.ecolife.mobile" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER_NOT_A_REAL_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      # Baked into the JS bundle at build time, so it has to be right here and
      # cannot be changed after the fact. Set the EXPO_PUBLIC_API_URL repository
      # variable to point builds somewhere else.
      - name: Generate the native Android project
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ecolife-core-mpx1fg-d137cf-86-107-77-229.sslip.io/api/v1' }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          echo "API base: $EXPO_PUBLIC_API_URL"
          # --no-install: pnpm already installed, and prebuild would otherwise
          # shell out to npm and flatten the hoisted layout Metro needs.
          pnpm exec expo prebuild --platform android --no-install

      # After prebuild, because the key hashes the Gradle files prebuild writes.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          # A miss on the exact key still reuses the newest previous cache, so a
          # dependency bump re-downloads only what actually changed.
          restore-keys: |
            gradle-${{ runner.os }}-

      # Release rather than debug: release bundles the JS into the APK, so the
      # artifact runs standalone. A debug APK expects a Metro server on the
      # machine that built it, which is useless as a downloadable.
      #
      # Signing: with the two keystore secrets set, the APK is signed with your
      # upload key and is Play-uploadable. Without them, Expo's template signs
      # release with the generated debug key — installable for testing, not
      # distributable.
      - name: Build the APK
        id: build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          # Recorded as an output so the Release can state its signing status
          # rather than leaving someone to guess from the filename.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload.keystore
            echo "::notice::Signing with the upload keystore from secrets."
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="$PWD/app/upload.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK is debug-signed. Fine for installing and testing, not for the Play Store."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Name the APK after the commit
        id: apk
        run: |
          src=$(find android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$src" ]; then
            echo "::error::Gradle reported success but produced no APK."
            find android/app/build/outputs -type f | head -40
            exit 1
          fi
          out="ecolife-${GITHUB_REF_NAME}-${GITHUB_SHA::7}.apk"
          mv "$src" "$out"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          # Long enough to be useful, short enough not to hoard storage.
          retention-days: 30
          if-no-files-found: error

      # Keep the keystore out of the cache and off any later step.
      - name: Remove the keystore
        if: always()
        run: rm -f android/app/upload.keystore

  # Separate job on purpose, and the ONLY one with a write-scoped token.
  #
  # It checks out nothing and runs nothing from the repository: it downloads
  # the APK the build produced and calls `gh`. So the token that can write to
  # Releases never coexists with the dependency tree that builds the app.
  publish:
    name: Publish to Releases
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # No actions/checkout. Nothing here needs the source, and not having it
      # is the point.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.apk }}

      # An artifact lives under its run, needs a GitHub login to download and
      # expires in 30 days. A Release is a public, permanent, linkable page —
      # which is where someone actually looks for "the app".
      #
      # ONE rolling pre-release rather than one per commit: a release for every
      # push to main would bury the Releases tab in hundreds of entries. The
      # `nightly` tag is retargeted to each new commit, so the page always
      # offers the newest build and the URL never changes:
      #   https://github.com/${{ github.repository }}/releases/tag/nightly
      #
      # `gh` is pre-installed on the runner, so this needs no third-party
      # action — the same reason gradle/actions was dropped earlier.
      - name: Publish the APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          # Required BECAUSE this job has no checkout: `gh` otherwise infers the
          # repository from the git remote and dies with "not a git repository".
          # Setting it explicitly is the right fix — reintroducing a checkout
          # just to let gh guess would put repository code back beside the
          # write-scoped token, which is the whole thing the split avoids.
          GH_REPO: ${{ github.repository }}
          APK: ${{ needs.apk.outputs.apk }}
          SIGNED: ${{ needs.apk.outputs.signed }}
        run: |
          TAG=nightly

          # A guard, not decoration: everything below deletes the tag it is
          # given. Refuse anything that could be a real version.
          case "$TAG" in
            v*|V*|[0-9]*) echo "::error::Refusing to recreate release tag '$TAG' — it looks like a version."; exit 1 ;;
          esac

          test -f "$APK" || { echo "::error::$APK missing from the downloaded artifact."; ls -la; exit 1; }

          # Written to a FILE, not captured with NOTES=$(cat <<EOF ...).
          # A heredoc inside $( ) still honours quotes while bash scans for the
          # closing paren, so a single apostrophe anywhere in the body is a
          # syntax error — "Expo's" below was exactly that, and it fails at
          # parse time, before the step runs. --notes-file sidesteps the whole
          # class rather than one apostrophe.
          cat > release-notes.md <<EOF
          Automated build of \`main\`, replaced on every push.

          | | |
          |---|---|
          | Commit | [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA) |
          | Built | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          Install on a device with "unknown sources" allowed.

          **This is a test build, not a store release.** Push notifications only
          work when the \`GOOGLE_SERVICES_JSON_BASE64\` secret is set; otherwise
          the build carries a placeholder Firebase config.
          EOF

          if [ "$SIGNED" = "true" ]; then
            cat >> release-notes.md <<'EOF'

          Signed with the configured upload keystore.
          EOF
          else
            # Worth stating outright on a PUBLIC page. Expo's debug keystore
            # ships with the template, so this APK's signature is not evidence
            # of origin: anyone can produce a build Android will accept as an
            # update to this one. Fine for a throwaway test build you installed
            # deliberately; not something to hand to users. Setting
            # ANDROID_KEYSTORE_BASE64 makes these builds properly signed.
            cat >> release-notes.md <<'EOF'

          > **Debug-signed — do not distribute.** No upload keystore is
          > configured, so this is signed with Expo's template debug key, which
          > is public. The signature proves nothing about who built it, and
          > anyone can sign an APK that Android will accept as an update to this
          > one. It also cannot be uploaded to Play and will not upgrade over a
          > Play install — uninstall any previous copy first.
          EOF
          fi

          # Delete and recreate rather than just re-uploading the asset: the
          # tag has to MOVE to this commit, or the page keeps claiming to be a
          # build it is not.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Nightly — ${GITHUB_SHA:0:7}$([ "$SIGNED" = "true" ] || echo ' (debug-signed)')" \
            --notes-file release-notes.md \
            --prerelease

          echo "::notice::Published $APK to ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
